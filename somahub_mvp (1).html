
<script>
  // QUIZ
  const quizForm = document.getElementById("quizForm");
  const quizResult = document.getElementById("quizResult");

  // Correct answers: update these values to match your quiz questions.
  const answers = {
    q1: "b",
    q2: "a",
    q3: "c"
  };

  quizForm.addEventListener("submit", function(event) {
    event.preventDefault();

    let score = 0;
    let answered = 0;

    for (const question in answers) {
      const selected = quizForm.querySelector(
        'input[name="' + question + '"]:checked'
      );

      if (selected) {
        answered++;
        if (selected.value === answers[question]) {
          score++;
        }
      }
    }

    if (answered < 3) {
      quizResult.textContent =
        "Please answer all three questions first.";
      quizResult.style.color = "#b91c1c";
      return;
    }

    quizResult.textContent =
      "Your score is " + score + "/3. " +
      (score === 3
        ? "Excellent work! 🎉"
        : "Good effort! Review the notes and try again.");

    quizResult.style.color =
      score === 3 ? "#15803d" : "#1d4ed8";
  });

  quizForm.addEventListener("reset", function() {
    quizResult.textContent = "";
  });

  // STUDENT GOAL
  const goalForm = document.getElementById("goalForm");
  const goalResult = document.getElementById("goalResult");

  function loadGoal() {
    try {
      const saved = localStorage.getItem("somahubGoal");
      if (!saved) return;

      const data = JSON.parse(saved);
      document.getElementById("studentName").value = data.name || "";
      document.getElementById("studyGoal").value = data.goal || "";
    } catch (error) {
      console.log("Could not load saved goal.");
    }
  }

  goalForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("studentName").value.trim();
    const goal = document.getElementById("studyGoal").value.trim();

    if (!goal) {
      goalResult.hidden = false;
      goalResult.textContent = "Please enter a learning goal.";
      return;
    }

    try {
      localStorage.setItem(
        "somahubGoal",
        JSON.stringify({ name: name, goal: goal })
      );

      goalResult.textContent =
        (name ? name + ", y" : "Y") +
        "our learning goal has been saved on this device.";
    } catch (error) {
      goalResult.textContent =
        "Your goal is entered, but this browser could not save it.";
    }

    goalResult.hidden = false;
  });

  // TEACHER RESOURCES
  const resourceForm = document.getElementById("resourceForm");
  const resourceList = document.getElementById("resourceList");

  function getResources() {
    try {
      return JSON.parse(
        localStorage.getItem("somahubResources") || "[]"
      );
    } catch (error) {
      return [];
    }
  }

  function showResources() {
    const resources = getResources();
    resourceList.replaceChildren();

    if (resources.length === 0) {
      const message = document.createElement("p");
      message.textContent = "No resources added yet.";
      resourceList.appendChild(message);
      return;
    }

    resources.forEach(function(resource) {
      const item = document.createElement("article");
      item.className = "resource";

      const title = document.createElement("h3");
      title.textContent = resource.title;

      const subject = document.createElement("p");
      subject.textContent = "Subject: " + resource.subject;

      const description = document.createElement("p");
      description.textContent = resource.description;

      const author = document.createElement("p");
      author.className = "small";
      author.textContent = "Added by " + resource.teacher;

      item.append(title, subject, description, author);
      resourceList.appendChild(item);
    });
  }

  resourceForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const resource = {
      teacher: document.getElementById("teacherName").value.trim(),
      title: document.getElementById("resourceTitle").value.trim(),
      subject: document.getElementById("resourceSubject").value,
      description: document.getElementById("resourceDescription").value.trim()
    };

    try {
      const resources = getResources();
      resources.unshift(resource);

      localStorage.setItem(
        "somahubResources",
        JSON.stringify(resources)
      );

      showResources();
      resourceForm.reset();
    } catch (error) {
      alert("This browser could not save the resource. Please try again.");
    }
  });

  // INITIALISE SOMAHUB
  loadGoal();
  showResources();
</script>

</body>
</html>
